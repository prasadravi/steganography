{% extends "base.html" %}
{% block title %}Register — Image Synthesis{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="panel">
      <h3>Create an account</h3>
      <form method="POST" enctype="multipart/form-data" novalidate>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" name="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" name="email" type="email" required>
        </div>
        <div class="mb-3 row">
          <div class="col">
            <label class="form-label">Mobile</label>
            <input class="form-control" name="mobile" type="text">
          </div>
          <div class="col">
            <label class="form-label">Address</label>
            <input class="form-control" name="address" type="text">
          </div>
        </div>
        <div class="mb-3 row">
          <div class="col">
            <label class="form-label">Password</label>
            <input class="form-control" name="password" type="password" required>
          </div>
          <div class="col">
            <label class="form-label">Confirm Password</label>
            <input class="form-control" name="confirm" type="password" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Profile Image</label>
          <input class="form-control" name="profile_image" type="file" accept="image/*">
        </div>
        <div class="d-flex gap-2">
          <button class="btn green-btn px-4" type="submit">Register</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('login') }}">Already have an account?</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
