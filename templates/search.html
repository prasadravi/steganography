{% extends "base.html" %}
{% block content %}
<div class="panel">
  <h3>Search users</h3>
  <form method="post" action="{{ url_for('search') }}" class="d-flex mb-3">
    <input name="q" class="form-control me-2" placeholder="Search username...">
    <button class="btn btn-success">Search</button>
  </form>

  {% if users %}
    <div class="list-group">
      {% for u in users %}
      <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <strong>{{ u.username }}</strong><br><small class="text-muted">{{ u.email }}</small>
        </div>

        <!-- POST form to send request -->
        <form method="post" action="{{ url_for('send_request', to_user_id=u.id) }}">
          <button class="btn btn-outline-success" type="submit">Send Request</button>
        </form>
      </div>
      {% endfor %}
    </div>
  {% else %}
    <p>No users found.</p>
  {% endif %}
</div>
{% endblock %}
