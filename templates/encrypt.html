{% extends "base.html" %}
{% block content %}
<div class="flex justify-center mt-10">
  <div class="bg-white p-6 rounded-2xl shadow-lg w-[500px]">
    <h2 class="text-2xl font-bold text-center mb-4 text-green-700">🔒 Encrypt Message</h2>
    <form id="encryptForm" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="block font-semibold mb-1">Upload Image (PNG or JPG)</label>
        <input type="file" name="image" accept="image/*" required class="w-full border p-2 rounded">
      </div>
      <div class="mb-3">
        <label class="block font-semibold mb-1">Secret Message</label>
        <textarea name="message" id="message" rows="3" placeholder="Type your secret message here..." class="w-full border p-2 rounded" required></textarea>
      </div>
      <div class="mb-3">
        <label class="block font-semibold mb-1">AES Key (optional)</label>
        <input type="text" name="aes_key" placeholder="e.g. 12345678" class="w-full border p-2 rounded">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Encrypt & Upload</button>
    </form>

    <div id="encryptResult" class="mt-4 text-center hidden">
      <p class="text-green-600 font-semibold">✅ Encrypted successfully!</p>
      <p class="text-sm text-gray-600">Stored key: <span id="storedKey" class="font-mono"></span></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('encryptForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);

  const res = await fetch("{{ url_for('upload_stego') }}", {
    method: "POST",
    body: fd
  });

  const data = await res.json();
  const resultDiv = document.getElementById('encryptResult');
  const storedKey = document.getElementById('storedKey');
  if (data.s3_key) {
    resultDiv.classList.remove('hidden');
    storedKey.textContent = data.s3_key;
  } else {
    resultDiv.classList.remove('hidden');
    storedKey.textContent = "❌ Error: " + (data.error || "unknown error");
  }
});
</script>
{% endblock %}
